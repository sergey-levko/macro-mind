spring:
  application:
    name: macromind

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:macromind}
    username: ${DB_USER:macromind}
    password: ${DB_PASSWORD:macromind}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  cache:
    type: caffeine
    cache-names: usda-food
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=24h

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 4096

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-long}

server:
  port: 8080

insights:
  schedule:
    daily-cron: "0 0 2 * * *"
    weekly-cron: "0 30 23 * * SUN"
