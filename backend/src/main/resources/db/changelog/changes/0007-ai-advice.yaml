databaseChangeLog:
  - changeSet:
      id: 0007-ai-advice
      author: macromind
      comment: "Create ai_advice table"
      changes:
        - sql:
            sql: |
              CREATE TABLE ai_advice (
                id           UUID         PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id      UUID         NOT NULL REFERENCES users(id),
                advice_type  VARCHAR(50)  NOT NULL CHECK (advice_type IN ('DAILY', 'WEEKLY')),
                content      TEXT         NOT NULL,
                period_start DATE         NOT NULL,
                created_at   TIMESTAMPTZ  NOT NULL DEFAULT now()
              )
      rollback:
        - dropTable:
            tableName: ai_advice
