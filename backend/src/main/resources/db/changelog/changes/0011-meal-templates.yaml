databaseChangeLog:
  - changeSet:
      id: 0011-meal-templates
      author: system
      changes:
        - createTable:
            tableName: meal_templates
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meal_templates_user
                    references: users(id)
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createTable:
            tableName: meal_template_items
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meal_template_items_template
                    references: meal_templates(id)
                    deleteCascade: true
              - column:
                  name: food_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meal_template_items_food
                    references: foods(id)
              - column:
                  name: meal_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity_g
                  type: decimal(8, 2)
                  constraints:
                    nullable: false
