services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macromind}
      POSTGRES_USER: ${POSTGRES_USER:-macromind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macromind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macromind}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
